<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录弹窗布局平衡对照</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 28px;
      color: #f5f5f5;
      background: #101114;
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      width: 600px;
      margin: 0;
    }

    figcaption {
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 600;
    }

    img {
      display: block;
      width: 600px;
      height: auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #050607;
    }
  </style>
</head>
<body>
  <figure>
    <figcaption>标注参考</figcaption>
    <img src="./login-modal-balance-reference.png" alt="登录弹窗布局标注参考">
  </figure>
  <figure>
    <figcaption>当前实现</figcaption>
    <img src="./login-modal-balance-full-v18.png" alt="登录弹窗当前实现">
  </figure>
</body>
</html>
